# HEALTH IS ALL - 웹 배포용 nginx 설정
#
# 프론트엔드(Flutter web 빌드 결과)와 백엔드(FastAPI)를 같은 오리진에서
# 서빙한다. 브라우저에서 봤을 때 도메인이 하나뿐이라 CORS 문제가 아예
# 발생하지 않고, api_config_web.dart가 window.location.origin을 그대로
# 쓰기 때문에 프론트 코드 수정도 필요 없다.
#
# 요청 흐름:
#   https://yourdomain.com/           -> Flutter web 정적 파일
#   https://yourdomain.com/api/...    -> backend 컨테이너(FastAPI)로 프록시

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web은 클라이언트 사이드 라우팅을 쓰므로, 존재하지 않는
    # 경로는 전부 index.html로 넘겨 앱이 직접 라우팅하도록 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 오래 캐시해도 안전하다 (Flutter가 빌드마다 파일명에
    # 해시를 붙이므로 캐시 무효화 걱정이 없다).
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 백엔드 API 프록시. docker-compose.web.yml에서 백엔드 서비스명은
    # "backend"로 고정되어 있다 (compose 내부 DNS로 자동 연결).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend:8000/healthz;
    }
}
